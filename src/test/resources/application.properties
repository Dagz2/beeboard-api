# Test configuration for Quarkus DevServices
# DevServices will automatically start a PostgreSQL container

# Enable DevServices for PostgreSQL
quarkus.devservices.enabled=true
quarkus.datasource.devservices.enabled=true
quarkus.datasource.devservices.image-name=postgres:16

# Hibernate settings for tests
quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.hibernate-orm.log.sql=false

# Disable mailer in tests
quarkus.mailer.mock=true

# JWT config for tests
mp.jwt.verify.publickey.location=publicKey.pem
mp.jwt.verify.issuer=beeboard-test
smallrye.jwt.sign.key.location=privateKey.pem

# Rate limiting for tests
password.reset.rate.limit=3
password.reset.rate.window.hours=1

# Faster BCrypt for tests
quarkus.test.flat-class-path=true
