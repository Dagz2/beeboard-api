# Datasource configuration
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username= ${DB_USERNAME}
quarkus.datasource.password= ${DB_PASSWORD}
quarkus.datasource.jdbc.url= ${DB_URL}

# Flyway Activation
quarkus.flyway.migrate-at-start=true

# Scripts emplacement
quarkus.flyway.locations=classpath:db/migration

# JWT Configuration
mp.jwt.verify.publickey.location=META-INF/resources/publicKey.pem
mp.jwt.verify.issuer=beeboard-api
smallrye.jwt.sign.key.location=META-INF/resources/privateKey.pem
jwt.duration=3600

# Security Configuration
# Disable RBAC for public endpoints (login)
quarkus.http.auth.permission.public.paths=/api/v1/auth/login
quarkus.http.auth.permission.public.policy=permit

# Enable RBAC for all other endpoints
quarkus.http.auth.permission.authenticated.paths=/api/v1/*
quarkus.http.auth.permission.authenticated.policy=authenticated

# Terminal colors for logging (optional)
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] (%t) %s%e%n
quarkus.log.console.color=true