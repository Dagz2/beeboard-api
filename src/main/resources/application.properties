# Datasource configuration
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username= ${DB_USERNAME}
quarkus.datasource.password= ${DB_PASSWORD}
quarkus.datasource.jdbc.url= ${DB_URL}

# Flyway Activation
quarkus.flyway.migrate-at-start=true

# Scripts emplacement
quarkus.flyway.locations=classpath:db/migration

# JWT Configuration
mp.jwt.verify.publickey.location=META-INF/resources/publicKey.pem
mp.jwt.verify.issuer=beeboard-api
smallrye.jwt.sign.key.location=META-INF/resources/privateKey.pem
jwt.duration=3600

# Security Configuration
# Disable RBAC for public endpoints (login and password reset)
quarkus.http.auth.permission.public.paths=/api/v1/auth/login,/api/v1/auth/password-reset/*
quarkus.http.auth.permission.public.policy=permit

# Enable RBAC for all other endpoints
quarkus.http.auth.permission.authenticated.paths=/api/v1/*
quarkus.http.auth.permission.authenticated.policy=authenticated

# Resend SMTP Configuration
quarkus.mailer.from=${MAIL_FROM:onboarding@resend.dev}
quarkus.mailer.host=smtp.resend.com
quarkus.mailer.port=465
quarkus.mailer.tls=REQUIRED
quarkus.mailer.start-tls=DISABLED
quarkus.mailer.username=resend
quarkus.mailer.password=${RESEND_API_KEY}
quarkus.mailer.mock=${MAILER_MOCK:false}

# Password Reset Configuration
frontend.base.url=${FRONTEND_BASE_URL:http://localhost:3000}
password.reset.enabled=${PASSWORD_RESET_ENABLED:true}
password.reset.rate.limit=${PASSWORD_RESET_RATE_LIMIT:3}
password.reset.rate.window.hours=${PASSWORD_RESET_RATE_WINDOW:1}

# Terminal colors for logging (optional)
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] (%t) %s%e%n
quarkus.console.color=true

# Security Context Cache (Caffeine)
quarkus.cache.caffeine."security-context".expire-after-write=15M
quarkus.cache.caffeine."security-context".maximum-size=1000