# Datasource configuration
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username= ${DB_USERNAME}
quarkus.datasource.password= ${DB_PASSWORD}
quarkus.datasource.jdbc.url= ${DB_URL}

# Flyway Activation
quarkus.flyway.migrate-at-start=true

# Scripts emplacement
quarkus.flyway.locations=classpath:db/migration

# Hibernate ORM Configuration
quarkus.hibernate-orm.mapping.format.global=ignore

# Ensure Hibernate orders INSERT statements by foreign key dependencies
quarkus.hibernate-orm.order-inserts=true
quarkus.hibernate-orm.order-updates=true

# JWT Configuration
mp.jwt.verify.publickey.location=META-INF/resources/publicKey.pem
mp.jwt.verify.issuer=beeboard-api
smallrye.jwt.sign.key.location=META-INF/resources/privateKey.pem
jwt.duration=3600

# REST Client Configuration (Cross-BC Communication)
# Note: AccessBcClient removed - Note BC now uses author_view CQRS read model
#       synchronized via domain events instead of REST calls

# Security Configuration
# Disable RBAC for public endpoints (login and password reset)
quarkus.http.auth.permission.public.paths=/api/v1/auth/login,/api/v1/auth/password-reset/*
quarkus.http.auth.permission.public.policy=permit

# Allow internal API without JWT authentication (for BC-to-BC communication)
quarkus.http.auth.permission.internal.paths=/api/v1/internal/*
quarkus.http.auth.permission.internal.policy=permit

# Enable RBAC for all other endpoints
quarkus.http.auth.permission.authenticated.paths=/api/v1/*
quarkus.http.auth.permission.authenticated.policy=authenticated

# Resend SMTP Configuration
quarkus.mailer.from=${MAIL_FROM:onboarding@resend.dev}
quarkus.mailer.host=smtp.resend.com
quarkus.mailer.port=465
quarkus.mailer.tls=REQUIRED
quarkus.mailer.start-tls=DISABLED
quarkus.mailer.username=resend
quarkus.mailer.password=${RESEND_API_KEY}
quarkus.mailer.mock=${MAILER_MOCK:false}

# Password Reset Configuration
frontend.base.url=${FRONTEND_BASE_URL:http://localhost:3000}
password.reset.enabled=${PASSWORD_RESET_ENABLED:true}
password.reset.rate.limit=${PASSWORD_RESET_RATE_LIMIT:3}
password.reset.rate.window.hours=${PASSWORD_RESET_RATE_WINDOW:1}

# Terminal colors for logging (optional)
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] (%t) %s%e%n
quarkus.console.color=true

# Security Context Cache (Caffeine)
quarkus.cache.caffeine."security-context".expire-after-write=15M
quarkus.cache.caffeine."security-context".maximum-size=1000

# Note: note-user-context cache removed - replaced by author_view CQRS read model
#       Local DB queries are fast (&lt;5ms), no caching needed

# Event-Driven Architecture Logging
# Access BC: Event emission logging
quarkus.log.category."org.access.domain.event".level=INFO
quarkus.log.category."org.shared.infrastructure.event".level=DEBUG

# Note BC: Event handling logging
quarkus.log.category."org.note.application.event".level=INFO

# Cache invalidation logging (for debugging)
quarkus.log.category."io.quarkus.cache".level=INFO

# CDI Events logging (for deep debugging)
quarkus.log.category."jakarta.enterprise.event".level=WARN