apiVersion: v1
kind: Secret
metadata:
  name: beeboard-api-secrets
  namespace: beeboard
  labels:
    app.kubernetes.io/name: beeboard-api
    app.kubernetes.io/component: secrets
    app.kubernetes.io/part-of: beeboard-api
type: Opaque
data:
  # PostgreSQL Credentials
  # IMPORTANT: Replace <BASE64_ENCODED_VALUE> with actual base64-encoded values
  # Example: echo -n "mypassword" | base64

  POSTGRES_USER: <BASE64_ENCODED_POSTGRES_USER>           # e.g., beeboard_user
  POSTGRES_PASSWORD: <BASE64_ENCODED_POSTGRES_PASSWORD>   # Generate with: openssl rand -base64 32
  POSTGRES_DB: <BASE64_ENCODED_POSTGRES_DB>               # e.g., beeboard_db

  # Database Connection URL for Quarkus
  # Format: jdbc:postgresql://postgresql:5432/beeboard_db
  # Example: echo -n "jdbc:postgresql://postgresql:5432/beeboard_db" | base64
  DB_URL: <BASE64_ENCODED_DB_URL>
  DB_USERNAME: <BASE64_ENCODED_DB_USERNAME>               # Same as POSTGRES_USER
  DB_PASSWORD: <BASE64_ENCODED_DB_PASSWORD>               # Same as POSTGRES_PASSWORD

  # JWT Keys (RSA 2048)
  # Generate with:
  #   openssl genrsa -out private.pem 2048
  #   openssl rsa -in private.pem -pubout -out public.pem
  #   cat private.pem | base64 -w 0
  #   cat public.pem | base64 -w 0

  MP_JWT_VERIFY_PRIVATEKEY: <BASE64_ENCODED_PRIVATE_KEY>
  MP_JWT_VERIFY_PUBLICKEY: <BASE64_ENCODED_PUBLIC_KEY>
  SMALLRYE_JWT_SIGN_KEY_LOCATION: <BASE64_ENCODED_PRIVATE_KEY_LOCATION>  # META-INF/resources/privateKey.pem (base64)

  # Resend API Key (SMTP)
  # Get your API key from https://resend.com/api-keys
  # Example: echo -n "re_xxxxxxxxxxxxxxxxxxxx" | base64
  RESEND_API_KEY: <BASE64_ENCODED_RESEND_API_KEY>
  QUARKUS_MAILER_PASSWORD: <BASE64_ENCODED_RESEND_API_KEY>  # Same as RESEND_API_KEY

---
# Instructions for generating values:
#
# 1. PostgreSQL Password:
#    openssl rand -base64 32 | tr -d '\n' | base64 -w 0
#
# 2. PostgreSQL User (example):
#    echo -n "beeboard_user" | base64
#
# 3. PostgreSQL Database (example):
#    echo -n "beeboard_db" | base64
#
# 4. Database URL (example):
#    echo -n "jdbc:postgresql://postgresql:5432/beeboard_db" | base64
#
# 5. JWT Keys:
#    # Generate RSA key pair
#    openssl genrsa -out private.pem 2048
#    openssl rsa -in private.pem -pubout -out public.pem
#
#    # Base64 encode for Kubernetes secret
#    cat private.pem | base64 -w 0
#    cat public.pem | base64 -w 0
#
# 6. Resend API Key:
#    # Get from https://resend.com/api-keys
#    echo -n "re_your_api_key_here" | base64
#
# After generating all values, replace all <BASE64_ENCODED_VALUE> placeholders above
