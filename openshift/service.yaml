apiVersion: v1
kind: Service
metadata:
  name: beeboard-api
  namespace: beeboard
  labels:
    app.kubernetes.io/name: beeboard-api
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: beeboard-api
  annotations:
    description: "BeeBoard API Service - Identity & Access Management + Note Management"
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    app: beeboard-api
  sessionAffinity: None
